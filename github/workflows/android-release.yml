name: Build Android AAB/APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      P4A_DOWNLOAD_RETRIES: 5

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        pip install \
          buildozer==1.6.0 \
          cython==0.29.36 \
          virtualenv


    - name: Install Android NDK 25
      run: |

        sdkmanager --install "ndk;25.2.9519653"

        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

        echo "ANDROIDNDK=$ANDROIDNDK" >> $GITHUB_ENV


    - name: Cache Buildozer
      uses: actions/cache@v4
      with:

        path: |
          ~/.buildozer
          ~/.gradle

        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}


    - name: Clean old build
      run: |

        rm -rf .buildozer


    - name: Build AAB
      run: |

        buildozer android clean

        buildozer -v android aab


    - name: Build APK
      run: |

        buildozer -v android debug


    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:

        name: ABG-Analyzer-Pro-AAB

        path: |
          bin/*.aab


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: ABG-Analyzer-Pro-APK

        path: |
          bin/*.apk
