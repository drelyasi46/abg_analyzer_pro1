name: Build Android AAB/APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDAPI: 34
      ANDROIDMINAPI: 24
      ANDROID_NDK_VERSION: r25b
      P4A_DOWNLOAD_RETRIES: 10

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install cython==0.29.37
        pip install virtualenv

    - name: Install Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Install NDK r25b
      run: |
        sdkmanager "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: Clean old build
      run: |
        buildozer android clean || true
        rm -rf .buildozer/android/platform/build-arm64-v8a

    - name: Build AAB
      run: |
        yes | buildozer android aab --release
      env:
        JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17*/x64

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: abg-analyzer-aab
        path: bin/*.aab
