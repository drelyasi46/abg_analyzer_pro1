name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Prepare CI build configuration
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git p4a-ci
          sed -i 's#https://pypi.python.org/packages/source/s/setuptools/#https://files.pythonhosted.org/packages/source/s/setuptools/#' p4a-ci/pythonforandroid/recipes/setuptools/__init__.py
          sed -i '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          sed -i '/^android\.sdk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^android\.ndk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^android\.release_artifact[[:space:]]*=/d' buildozer.spec
          sed -i '/^android\.release_keystore[[:space:]]*=/d' buildozer.spec
          sed -i '/^android\.release_keyalias[[:space:]]*=/d' buildozer.spec
          printf '\np4a.source_dir = ./p4a-ci\n' >> buildozer.spec
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          grep -n 'p4a.source_dir' buildozer.spec
          grep -n 'url =' p4a-ci/pythonforandroid/recipes/setuptools/__init__.py

      - name: Build Android APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABG-Analyzer-Pro-debug
          path: bin/*.apk
