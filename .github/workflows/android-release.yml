name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Build APK
        run: buildozer android release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABG-Analyzer-Pro
          path: bin/*.apk
